# ScholarPilot AI — Local infrastructure (all free / self-hosted, open-source)
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholarpilot
      POSTGRES_PASSWORD: scholarpilot
      POSTGRES_DB: scholarpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scholarpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: scholarpilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: scholarpilot-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: scholarpilot_dev_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  # S3-compatible object storage (free alternative to AWS S3 in dev)
  minio:
    image: minio/minio:latest
    container_name: scholarpilot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scholarpilot
      MINIO_ROOT_PASSWORD: scholarpilot123
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  meili_data:
  minio_data:
